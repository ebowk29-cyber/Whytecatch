<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0D3A3D">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,sans-serif}
img{max-width:100%}
</style>
<title>Whyte Catch Tilapia Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first sales ledger. Bottom tab bar on phones, left rail from 900px.
   Pond-teal ink on cool paper; gill-red is reserved for money owed and stock-outs. */
:root{
  --bg:#EDF2F1; --surface:#FFFFFF; --sunk:#E1E9E8; --ink:#102426; --ink2:#4F6467; --line:#CBD7D6;
  --accent:#0B6E72; --on-accent:#FFFFFF; --accent-soft:#D4ECEB; --bar:#9DCFCD;
  --owe:#B53A26; --owe-soft:#F8E1DB; --on-owe:#FFFFFF;
  --good:#1D7A4B; --good-soft:#D8F0E3; --warn:#8A5800; --warn-soft:#F7E8C6;
  --hero:#0D3A3D; --on-hero:#EAF6F5; --hero-dim:#9FC9C6;
  --shadow:0 1px 2px rgba(16,36,38,.06),0 6px 18px rgba(16,36,38,.07);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --navh:62px; --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1718; --surface:#112325; --sunk:#183032; --ink:#E4F0EE; --ink2:#95B0AD; --line:#254342;
  --accent:#4CC2BE; --on-accent:#06201F; --accent-soft:#143B3C; --bar:#2B6F6D;
  --owe:#F08A6E; --owe-soft:#3B1F18; --on-owe:#2A0E08;
  --good:#5CCB8F; --good-soft:#143525; --warn:#E6B24C; --warn-soft:#3A2B0D;
  --hero:#124244; --on-hero:#EAF6F5; --hero-dim:#9FC9C6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1718; --surface:#112325; --sunk:#183032; --ink:#E4F0EE; --ink2:#95B0AD; --line:#254342;
  --accent:#4CC2BE; --on-accent:#06201F; --accent-soft:#143B3C; --bar:#2B6F6D;
  --owe:#F08A6E; --owe-soft:#3B1F18; --on-owe:#2A0E08;
  --good:#5CCB8F; --good-soft:#143525; --warn:#E6B24C; --warn-soft:#3A2B0D;
  --hero:#124244; --on-hero:#EAF6F5; --hero-dim:#9FC9C6;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--f-body);
  padding-block:10px calc(var(--navh) + 40px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
.wrap{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:26px;font-weight:800;font-stretch:108%;letter-spacing:-.01em}
h2{font-size:18px;font-weight:700;font-stretch:104%}
p{margin:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:40px;height:24px;color:var(--accent);flex:none}
.brand b{display:block;font:800 17px/1 var(--f-display);font-stretch:118%;letter-spacing:-.01em;white-space:nowrap}
.brand small{display:block;font:500 10.5px/1.2 var(--f-body);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);margin-top:4px}
.top-r{display:flex;align-items:center;gap:8px}
.sync{font:500 11px/1 var(--f-mono);display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:99px;background:var(--sunk);color:var(--ink2);white-space:nowrap}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--good)}
.sync.local i{background:var(--warn)} .sync.busy i{background:var(--accent)} .sync.bad i{background:var(--owe)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;flex:none}
.banner{margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.banner.bad{background:var(--owe-soft);color:var(--owe)}
.banner button{flex:none}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pad{padding:14px}
.sec{margin-top:20px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;padding:0 2px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:2px 0 14px}
.page-h p{margin-top:6px}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;background:none;border:0;border-top:1px solid var(--line);min-height:58px}
.row:first-child{border-top:0}
button.row:hover{background:var(--sunk)}
.r-main{flex:1;min-width:0}
.r-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-sub{font-size:13px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.r-end{text-align:right;flex:none;display:grid;gap:4px;justify-items:end}
.amt{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.amt.owe{color:var(--owe)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--warn)} .dot.owe{background:var(--owe)} .dot.good{background:var(--good)}
.day-h{display:flex;justify-content:space-between;padding:10px 14px;background:var(--sunk);font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.03em}
.empty{padding:26px 18px;text-align:center;color:var(--ink2)}
.empty h3{color:var(--ink);margin-bottom:6px;font-size:17px}
.empty .btn{margin-top:14px}

.pill{display:inline-block;font:600 11px/1 var(--f-body);padding:5px 8px;border-radius:99px;letter-spacing:.02em;white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.owe{background:var(--owe-soft);color:var(--owe)} .pill.mute{background:var(--sunk);color:var(--ink2)}

/* controls */
.btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.owe{background:var(--owe);border-color:var(--owe);color:var(--on-owe)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btns .btn{flex:1 1 140px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f{display:grid;gap:6px;margin-top:12px;min-width:0}
.f>span{font-size:12px;font-weight:600;color:var(--ink2);letter-spacing:.02em}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%;min-width:0}
textarea{min-height:76px;resize:vertical}
.sheet input,.sheet select,.sheet textarea{background:var(--bg)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:70px;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:0 8px}
.sheet .seg button{background:var(--bg)}
.seg button.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.search{margin-bottom:12px}

/* home */
.hero{background:var(--hero);color:var(--on-hero);border-radius:16px;padding:18px 18px 16px}
.hero .eyebrow{color:var(--hero-dim)}
.hero .big{font:800 36px/1.05 var(--f-display);font-stretch:112%;margin-top:10px;letter-spacing:-.01em;overflow-wrap:anywhere}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(234,246,245,.18)}
.trio span{display:block;font-size:11px;color:var(--hero-dim);letter-spacing:.05em;text-transform:uppercase}
.trio b{display:block;font:500 14px var(--f-mono);margin-top:4px;overflow-wrap:anywhere}
.chart{padding:12px 14px 8px}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gt{fill:var(--ink2);font:10px var(--f-mono)}
.chart .bn{fill:var(--bar)} .chart .bh{fill:var(--accent)}
.chart .gv{fill:var(--ink);font:600 10px var(--f-mono)}
.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.actions{grid-template-columns:repeat(4,minmax(0,1fr))}}
.actions .btn{justify-content:flex-start}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:12px}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start}
.steps .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 13px/30px var(--f-mono);text-align:center}
.notice{margin-bottom:14px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.skel{height:120px;border-radius:16px;background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sh 1.4s linear infinite;margin-bottom:12px}
@keyframes sh{to{background-position:-200% 0}}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line)}
.kpi{background:var(--surface);padding:14px}
.kpi span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.kpi b{display:block;font:500 20px/1.2 var(--f-mono);margin-top:6px;overflow-wrap:anywhere}
.kpi small{display:block;margin-top:2px;color:var(--ink2);font-size:12px}
.kpi.neg b{color:var(--owe)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:600 11px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);text-align:right;padding:8px 14px}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:10px 14px;border-top:1px solid var(--line);text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td:first-child{font-family:var(--f-body);white-space:normal;min-width:120px}
.scroll-x{overflow-x:auto}

/* selling */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-width:0}
.tile .nm{font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.tile .pr{font:500 13px var(--f-mono);color:var(--ink2)}
.tile.in{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tile.in .nm{padding-right:30px}
.tile .cnt{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--on-accent);font:600 12px/24px var(--f-mono);text-align:center;padding:0 6px}
.dock{position:sticky;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 10px);margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--hero);color:var(--on-hero);border-radius:14px;padding:10px 10px 10px 16px;box-shadow:var(--shadow);z-index:5}
.dock b{font:500 16px var(--f-mono)} .dock span{display:block;font-size:12px;color:var(--hero-dim)}
.dock .btn{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.line{padding:12px 14px;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
.l-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.l-top b{font-weight:600}
.l-ctl{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stepper button{width:40px;height:44px;border:0;background:var(--sunk);font-size:20px;line-height:1}
.stepper input{width:62px;border:0;border-radius:0;text-align:center;font-family:var(--f-mono);padding:0 4px}
.pricebox{display:flex;align-items:center;gap:6px;color:var(--ink2)}
.pricebox input{width:96px;font-family:var(--f-mono)}
.l-total{margin-left:auto;font:600 15px var(--f-mono)}
.warnline{margin-top:6px;font-size:12px;color:var(--warn)}
.sumrow{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.sumrow.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:12px;font-weight:700;font-size:18px}
.sumrow.tot .mono{font-size:20px}
.pick{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left}
.sheet .pick{background:var(--bg)}

/* sheet, toast, receipt */
#sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(4,16,17,.58)}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
@media(min-width:700px){#sheet{align-items:center}.sheet{border-radius:18px;padding-bottom:18px}}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;z-index:70;font-size:14px;max-width:min(92vw,420px);box-shadow:var(--shadow)}
.receipt{font:13px/1.55 var(--f-mono);border:1px dashed var(--ink2);border-radius:10px;padding:14px;margin-top:10px;background:var(--bg)}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed var(--ink2);margin:8px 0}
.receipt .l{display:flex;justify-content:space-between;gap:10px}
.receipt .l span:first-child{min-width:0;overflow-wrap:anywhere}
.receipt .t{font-weight:600;font-size:15px}
details{margin-top:12px}
details summary{cursor:pointer;color:var(--ink2);font-size:13px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);
  height:calc(var(--navh) + env(safe-area-inset-bottom,0px));
  padding:6px max(8px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(8px,env(safe-area-inset-left,0px))}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;font-size:11px;font-weight:600;color:var(--ink2);border-radius:10px;min-width:0}
#nav button.on{color:var(--accent)}
#nav button.sell .ico{background:var(--accent);color:var(--on-accent);width:46px;height:30px;padding:4px 11px;border-radius:15px}
@media(min-width:900px){
  body{padding-left:max(248px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
  #nav{top:0;right:auto;bottom:0;width:216px;height:auto;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:24px 12px;gap:4px;justify-content:flex-start}
  #nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;font-size:15px;min-height:46px;padding:0 12px}
  #nav button.on{background:var(--accent-soft)}
  #nav button.sell .ico{width:34px;height:28px;padding:3px 7px;border-radius:8px}
  .wrap{max-width:1000px}
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .hero .big{font-size:44px}
  .dock{bottom:16px}
  #toast{bottom:28px}
}
@media(prefers-reduced-motion:reduce){.skel{animation:none}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 24" aria-hidden="true"><path d="M2 12C6 4 18 3 26 10L38 3V21L26 14C18 21 6 20 2 12Z" fill="currentColor"/><circle cx="9" cy="10.6" r="1.7" fill="var(--bg)"/></svg>
      <div><b id="biz-name">Whyte Catch</b><small>Tilapia Hub</small></div>
    </div>
    <div class="top-r">
      <span class="sync busy" id="sync"><i></i><span>Opening</span></span>
      <button class="iconbtn" data-act="nav" data-r="setup" aria-label="Shop setup" id="gear"></button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<nav id="nav" aria-label="Sections"></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
(function(){
'use strict';
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/,/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>'GH₵ '+(n<0?'-':'')+Math.abs(n).toLocaleString('en-GH',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>'GH₵ '+(n<0?'-':'')+Math.abs(Math.round(n)).toLocaleString('en-GH');
const qn=n=>String(Math.round(n*100)/100);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>{d=new Date(d);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const today=()=>dkey(Date.now());
const parseKey=k=>{const a=k.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const fmtDay=(k,o)=>parseKey(k).toLocaleDateString('en-GB',o||{weekday:'short',day:'numeric',month:'short'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};

function enqueue(fn){pend++;chrome();chain=chain.then(fn).catch(writeFail).then(()=>{pend--;chrome()})}
function writeFail(e){
  const c=e&&e.code;
  if(c==='quota_exceeded')toast('Storage is full. Remove old example data or backup and erase old records.');
  else if(c==='invalid_argument'){canWrite=false;toast('You only have view access, so this was not saved.');}
  else toast('Could not save that change. Check your connection and try again.');
  touch();
}
function guard(){if(!canWrite){toast('You have view-only access. Ask the owner for Contributor access.');return false}return true}
function put(col,id,obj){
  S[col][id]=obj;touch();
  if(DB)enqueue(()=>DB.collection(col).doc(id).set(obj));else saveLocal();
}
function del(col,id){
  delete S[col][id];touch();
  if(DB)enqueue(()=>DB.collection(col).doc(id).delete());else saveLocal();
}
function subscribe(col){
  DB.collection(col).onSnapshot(snap=>{
    const m={};snap.docs.forEach(d=>{m[d.id]=d.data()});S[col]=m;seen.add(col);
    if(!snap.metadata.fromCache)confirmed.add(col);
    if(confirmed.size>=COLS.length){clearTimeout(timer);stale=false}
    touch();
  },err=>{if(err&&err.code==='revoked')lost=true;else stale=true;touch()});
}
async function boot(){
  const h=location.hash.slice(1);if(ROUTES[h])route=h;
  drawNav();render();
  try{DB=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){DB=null}
  if(DB){
    mode='cloud';
    try{const u=await window.claude.use('user');if(u&&u.can){const w=await u.can('data.write');if(w===false)canWrite=false}}catch(e){}
    timer=setTimeout(()=>{if(confirmed.size<COLS.length){stale=true;touch()}},10000);
    COLS.forEach(subscribe);
  }else{mode='local';loadLocal();COLS.forEach(c=>seen.add(c))}
  render();
}

/* ================= derived numbers ================= */
function owedOf(cid){return r2(live().filter(s=>s.custId===cid).reduce((a,s)=>a+(s.balance||0),0))}
function totalOwed(){return r2(live().reduce((a,s)=>a+(s.balance||0),0))}
function custStats(){
  const m={};Object.keys(S.customers).forEach(id=>{m[id]={owed:0,oldest:null,last:0,spend:0,n:0}});
  live().forEach(s=>{const c=m[s.custId];if(!c)return;c.n++;c.spend+=s.total;c.last=Math.max(c.last,s.ts);
    if(s.balance>0.004){c.owed+=s.balance;if(c.oldest===null||s.ts<c.oldest)c.oldest=s.ts}});
  Object.keys(m).forEach(k=>{m[k].owed=r2(m[k].owed)});return m;
}
function lowStock(){return arr('products').filter(p=>(p.stock||0)<=(p.low==null?lowDef():p.low)).sort((a,b)=>(a.stock||0)-(b.stock||0))}
function period(from,to){
  const inR=d=>(!from||d>=from)&&(!to||d<=to);
  const o={rev:0,cogs:0,n:0,collected:0,credit:0,recovered:0,exp:0,loss:0,byP:{},byM:{},byC:{},byD:{},byE:{},sales:[]};
  live().forEach(s=>{
    if(!inR(s.date))return;o.sales.push(s);o.n++;o.rev+=s.total;
    s.items.forEach(it=>{o.cogs+=it.qty*it.cost;const k=it.pid||it.name;
      const p=o.byP[k]||(o.byP[k]={name:it.name,unit:it.unit,qty:0,rev:0,cost:0});p.qty+=it.qty;p.rev+=it.qty*it.price;p.cost+=it.qty*it.cost});
    const p0=s.paid0==null?s.paid:s.paid0;o.collected+=p0;o.credit+=s.total-p0;
    if(s.method!=='Credit')o.byM[s.method]=(o.byM[s.method]||0)+p0;
    const ck=s.custId||'_walk';const c=o.byC[ck]||(o.byC[ck]={name:s.custName||'Walk-in customers',spend:0,n:0});c.spend+=s.total;c.n++;
    o.byD[s.date]=(o.byD[s.date]||0)+s.total;
  });
  arr('payments').forEach(p=>{if(inR(p.date)){o.recovered+=p.amount;o.byM[p.method]=(o.byM[p.method]||0)+p.amount}});
  o.collected+=o.recovered;
  arr('expenses').forEach(e=>{if(inR(e.date)){o.exp+=e.amount;o.byE[e.cat]=(o.byE[e.cat]||0)+e.amount}});
  arr('stockLog').forEach(l=>{if(l.type==='writeoff'&&inR(l.date))o.loss+=l.value||0});
  o.gross=o.rev-o.cogs;o.net=o.gross-o.exp-o.loss;return o;
}

/* ================= chart ================= */
function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
const short=n=>n>=1000?(Math.round(n/100)/10)+'k':String(Math.round(n));
function bars(data){
  const W=340,H=150,top=18,bot=22,n=data.length||1;
  const mx=Math.max.apply(null,data.map(d=>d.v).concat([0]));const nice=niceMax(mx);
  const gap=n>20?2:n>10?4:8,bw=(W-gap*(n-1))/n;let g='',b='',l='';
  [0,.5,1].forEach(f=>{const y=top+(H-top-bot)*(1-f);g+=`<line x1="0" x2="${W}" y1="${y}" y2="${y}" class="gl"/>`;if(f>0)g+=`<text x="0" y="${y-3}" class="gt">${short(nice*f)}</text>`});
  const step=n<=8?1:Math.ceil(n/7);
  data.forEach((d,i)=>{
    const h=(H-top-bot)*d.v/nice,x=i*(bw+gap),y=H-bot-h;
    b+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,d.v>0?1.5:0).toFixed(1)}" rx="2" class="${d.hi?'bh':'bn'}"/>`;
    if(i%step===0||i===n-1)l+=`<text x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle" class="gt">${esc(d.k)}</text>`;
    if(d.hi&&d.v>0)l+=`<text x="${Math.min(W-2,x+bw)}" y="${Math.max(10,y-4).toFixed(1)}" text-anchor="end" class="gv">${short(d.v)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales per day, GH cedis">${g}${b}${l}</svg>`;
}
function dayBars(from,to){
  const p=period(from,to),out=[];let k=from;const wd=!(parseKey(to)-parseKey(from)>9*864e5);
  while(k<=to){out.push({k:wd?fmtDay(k,{weekday:'short'}):String(parseKey(k).getDate()),v:r2(p.byD[k]||0),hi:k===to});k=addDays(k,1)}
  return out;
}

async function saveFile(name,data){
  let d=null;try{d=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(d){try{await d.save({filename:name,data:data});toast('File saved')}catch(e){if(!e||e.code!=='declined')toast('Could not save the file.')}return}
  try{
    const type=/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/json';
    const url=URL.createObjectURL(new Blob([data],{type}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);toast('File downloaded');
  }catch(e){toast('Could not save the file.')}
}

  L.push('Receipt '+s.no+' - '+fmtDay(s.date,{day:'numeric',month:'short',year:'numeric'})+', '+fmtTime(s.ts));

  L.push('--------------------');
  if(s.discount>0)L.push('Discount: -'+money(s.discount));

let cart=[];

function resetSell(){cart=[];sell={step:1,q:'',custId:'',method:'Cash',discount:'',delivery:'',mode:'pickup',recv:'',recvTouched:false,note:''}}
function calc(){
  const sub=r2(cart.reduce((a,l)=>a+l.qty*l.price,0));
  const disc=Math.min(sub,Math.max(0,num(sell.discount)));
  const dl=sell.mode==='delivery'?Math.max(0,num(sell.delivery)):0;
  const total=r2(sub-disc+dl);
  const recv=sell.method==='Credit'?0:(sell.recvTouched?Math.max(0,num(sell.recv)):total);
  const paid=Math.min(recv,total);
  return{sub,disc,dl,total,recv,paid,change:r2(Math.max(0,recv-total)),bal:r2(total-paid)};
}
function tile(id,p){
  const c=cart.find(l=>l.pid===id),st=p.stock<=0?'<span class="pill owe">Out</span>':p.stock<=(p.low==null?lowDef():p.low)?`<span class="pill warn">${qn(p.stock)} left</span>`:`<span class="pill mute">${qn(p.stock)} ${esc(p.unit)}</span>`;

function dayData(){
  const t=today(),sl2=live().filter(s=>s.date===t),pay=arr('payments').filter(p=>p.date===t),ex=arr('expenses').filter(e=>e.date===t);
  const rec={Cash:0,MoMo:0,Bank:0},exp={Cash:0,MoMo:0,Bank:0};let tot=0,credit=0,gross=0;
  sl2.forEach(s=>{const p0=s.paid0==null?s.paid:s.paid0;tot+=s.total;credit+=s.total-p0;if(s.method!=='Credit')rec[s.method]+=p0;s.items.forEach(i=>{gross+=i.qty*(i.price-i.cost)})});
  pay.forEach(p=>{rec[p.method]=(rec[p.method]||0)+p.amount});
  ex.forEach(e=>{exp[e.method||'Cash']=(exp[e.method||'Cash']||0)+e.amount});
  const expTot=ex.reduce((a,e)=>a+e.amount,0);
  return{t,n:sl2.length,tot:r2(tot),credit:r2(credit),rec,exp,expTot,gross:r2(gross),expected:r2(rec.Cash-exp.Cash),owed:totalOwed()};
}

function loadSample(){
  if(!guard())return;
  let seed=11;const rnd=()=>{seed=(seed*1664525+1013904223)%4294967296;return seed/4294967296};
  const defs=[['Fresh tilapia – Small','pcs',14,20,90,20],['Fresh tilapia – Medium','pcs',22,32,110,20],['Fresh tilapia – Large','pcs',34,48,80,15],
    ['Jumbo tilapia','pcs',48,65,24,8],['Smoked tilapia – Medium','pcs',28,40,45,10],['Tilapia fillet','kg',70,95,30,8],

  const custs=[['Auntie Efua (chop bar)','024 000 0001'],['Kwesi Mensah','024 000 0002'],['Madam Adwoa (restaurant)','020 000 0003'],['Papa K Grills','055 000 0004'],['Nana Yaa','050 000 0005']];
  const t0=today(),sold={},out=[];
  for(let d=13;d>=0;d--){

    for(let k=0;k<n;k++){
      const dt=parseKey(date),h=7+Math.floor(rnd()*10),ts=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),h,Math.floor(rnd()*60)).getTime();
      const ids=[],ni=1+Math.floor(rnd()*3);while(ids.length<ni){const i=Math.floor(rnd()*defs.length);if(ids.indexOf(i)<0)ids.push(i)}
      const items=ids.map(i=>{const df=defs[i],q=df[1]==='crate'?1:df[1]==='kg'?1+Math.floor(rnd()*4):2+Math.floor(rnd()*7);sold[i]=(sold[i]||0)+q;return{pid:'ex_p'+i,name:df[0],unit:df[1],qty:q,price:df[3],cost:df[2]}});
      const sub=items.reduce((a,l)=>a+l.qty*l.price,0),disc=rnd()<.1?5:0,del=rnd()<.15?10:0,total=sub-disc+del;
      let ci=rnd()<.55?Math.floor(rnd()*custs.length):-1,r=rnd(),method=r<.45?'Cash':r<.8?'MoMo':'Credit';
      if(method==='Credit'&&ci<0)method='Cash';
      const paid=method==='Credit'?0:total;
      day.push({ts,date,items,subtotal:sub,discount:disc,delivery:del,total,paid,paid0:paid,balance:total-paid,method,custId:ci>=0?'ex_c'+ci:'',custName:ci>=0?custs[ci][0]:'',mode:del?'delivery':'pickup',note:'',by:'',void:false,demo:true});
    }
    day.sort((a,b)=>a.ts-b.ts).forEach((s,i)=>{s.no='WC'+date.slice(2).replace(/-/g,'')+'-'+String(i+1).padStart(3,'0');out.push(s)});
  }
  defs.forEach((df,i)=>put('products','ex_p'+i,{name:df[0],unit:df[1],cost:df[2],price:df[3],stock:Math.max(0,df[4]-(sold[i]||0)),low:df[5],demo:true}));
  custs.forEach((c,i)=>put('customers','ex_c'+i,{name:c[0],phone:c[1],note:'Example customer',demo:true}));
  out.forEach((s,i)=>put('sales','ex_s'+i,s));
  [[-9,'Ice & power',120,'Cash','Cold room power'],[-6,'Transport',80,'Cash','Market run'],[-4,'Wages',200,'MoMo','Weekly helper'],[-2,'Fuel',150,'Cash',''],[0,'Packaging',60,'Cash','Bags and ice']].forEach((e,i)=>{
    const dk=addDays(t0,e[0]),dt=parseKey(dk);put('expenses','ex_e'+i,{ts:new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),12,0).getTime(),date:dk,cat:e[1],amount:e[2],method:e[3],note:e[4],demo:true})});
  const d1=addDays(t0,-8),d2=addDays(t0,-3);
  put('stockLog','ex_l0',{ts:parseKey(d1).getTime()+4e7,date:d1,pid:'ex_p2',pname:defs[2][0],type:'restock',qty:40,unitCost:34,value:1360,reason:'',demo:true});
  put('stockLog','ex_l1',{ts:parseKey(d2).getTime()+4e7,date:d2,pid:'ex_p0',pname:defs[0][0],type:'writeoff',qty:4,unitCost:14,value:56,reason:'Spoiled',demo:true});
  const debtor=custs.map((c,i)=>'ex_c'+i).find(id=>owedOf(id)>20);
  if(debtor)receivePayment(debtor,Math.round(owedOf(debtor)*0.5),'MoMo','Part payment');
  toast('Example data loaded. Remove it any time in Shop setup.');
}

/* ================= actions ================= */
const ACT={
 nav:el=>go(el.dataset.r),
 close:()=>closeSheet(),
 askok:()=>{const f=askCb;askCb=null;closeSheet();if(f)f()},
 pick:el=>{SH[el.dataset.k]=el.dataset.v;Array.prototype.forEach.call(el.parentElement.children,c=>c.classList.toggle('on',c===el))},
 /* sell */
 add:el=>{const id=el.dataset.id,p=S.products[id];if(!p)return;const l=cart.find(x=>x.pid===id);
   if(l)l.qty=r2(l.qty+(l.unit==='kg'?.5:1));else cart.push({pid:id,name:p.name,unit:p.unit,qty:1,price:p.price,cost:p.cost||0});
   const sc=window.scrollY;render();window.scrollTo(0,sc)},
 inc:el=>{const l=cart[+el.dataset.i];l.qty=r2(l.qty+(l.unit==='kg'?.5:1));render()},
 dec:el=>{const l=cart[+el.dataset.i];l.qty=r2(Math.max(0,l.qty-(l.unit==='kg'?.5:1)));if(l.qty<=0)cart.splice(+el.dataset.i,1);render()},
 rm:el=>{cart.splice(+el.dataset.i,1);render()},
 review:()=>{if(!cart.length){toast('Tap a product to add it first');return}sell.step=2;render();window.scrollTo(0,0)},
 back:()=>{sell.step=1;render();window.scrollTo(0,0)},
 method:el=>{sell.method=el.dataset.v;sell.recvTouched=false;sell.recv='';render()},
 mode:el=>{sell.mode=el.dataset.v;render()},
 record:()=>recordSale(),
 pickcust:()=>{
   openSheet(`${shHead('Choose customer')}<input class="search" type="search" id="custq" placeholder="Search customers" data-in="custq" autocomplete="off"><div class="panel" id="clist">${custPick('')}</div><div class="btns"><button class="btn" data-act="custnew" data-s="1">${ico('plus',18)} New customer</button></div>`)},
 setcust:el=>{sell.custId=el.dataset.id||'';closeSheet();render()},
 /* sales */
 sale:el=>saleSheet(el.dataset.id),
 copyrec:el=>{const s=S.sales[el.dataset.id];if(s)copyText(receiptText(Object.assign({},s,{id:el.dataset.id})))},
 voidask:el=>{const id=el.dataset.id;openSheet(`${shHead('Void this sale?')}<p class="muted small">The stock goes back on the shelf and any balance owed is cleared. The sale stays in the list marked as voided.</p>
   <label class="f"><span>Reason</span><select id="v-why"><option>Entered by mistake</option><option>Customer cancelled</option><option>Fish returned</option><option>Other</option></select></label>
   <div class="btns"><button class="btn" data-act="close">Keep sale</button><button class="btn owe" data-act="voidgo" data-id="${id}">Void sale</button></div>`)},
 voidgo:el=>{if(!guard())return;voidSale(el.dataset.id,$('#v-why').value)},
 sf:el=>{sl.f=el.dataset.v;render()},
 /* stock */
 prod:el=>prodSheet(el.dataset.id),
 prodnew:()=>prodForm(''),
 prodedit:el=>prodForm(el.dataset.id),
 prodsave:el=>{
   if(!guard())return;const id=el.dataset.id,name=$('#p-name').value.trim(),price=num($('#p-price').value),cost=num($('#p-cost').value),lv=$('#p-low').value.trim(),low=lv===''?lowDef():num(lv);
   if(!name){toast('Enter a product name');return}if(!(price>0)){toast('Enter a selling price');return}
   if(id){put('products',id,Object.assign({},S.products[id],{name,unit:SH.unit,price,cost,low}))}
   else put('products',uid(),{name,unit:SH.unit||'pcs',price,cost,stock:num($('#p-stock').value),low,created:Date.now()});
   closeSheet();toast('Product saved')},
 proddel:el=>{const id=el.dataset.id,p=S.products[id];ask('Remove '+p.name+'?','Past sales keep their records. This product will no longer appear for selling.','Remove',()=>{if(guard()){del('products',id);cart=cart.filter(l=>l.pid!==id)}},true)},
 restock:el=>restockSheet(el.dataset.id),
 restocksave:()=>{
   if(!guard())return;const id=$('#r-pid').value,p=S.products[id],q=num($('#r-qty').value),uc=num($('#r-cost').value);
   if(!p||!(q>0)){toast('Enter the quantity you added');return}
   put('products',id,Object.assign({},p,{stock:r2((p.stock||0)+q),cost:$('#r-upd').checked&&uc>0?uc:p.cost}));
   const ts=Date.now();put('stockLog',uid(),{ts,date:dkey(ts),pid:id,pname:p.name,type:'restock',qty:q,unitCost:uc,value:r2(q*uc),reason:'',by:by()});
   closeSheet();toast('Stock updated')},
 writeoff:el=>writeoffSheet(el.dataset.id),
 wosave:()=>{
   if(!guard())return;const id=$('#w-pid').value,p=S.products[id],q=num($('#w-qty').value);
   if(!p||!(q>0)){toast('Enter the quantity to write off');return}
   put('products',id,Object.assign({},p,{stock:r2(Math.max(0,(p.stock||0)-q))}));
   const ts=Date.now();put('stockLog',uid(),{ts,date:dkey(ts),pid:id,pname:p.name,type:'writeoff',qty:q,unitCost:p.cost||0,value:r2(q*(p.cost||0)),reason:$('#w-why').value,by:by()});
   closeSheet();toast('Written off')},
 /* customers */
 cust:el=>custSheet(el.dataset.id),
 custnew:el=>custForm('',!!el.dataset.s),
 custedit:el=>custForm(el.dataset.id),
 custsave:el=>{
   if(!guard())return;const id=el.dataset.id,name=$('#c-name').value.trim();if(!name){toast('Enter the customer name');return}
   const o={name,phone:$('#c-phone').value.trim(),note:$('#c-note').value.trim()};
   if(id){put('customers',id,Object.assign({},S.customers[id],o));if(Object.keys(S.sales).length)arr('sales').forEach(s=>{if(s.custId===id&&s.custName!==name)put('sales',s.id,Object.assign({},S.sales[s.id],{custName:name}))})}
   else{const nid=uid();put('customers',nid,Object.assign(o,{created:Date.now()}));if(el.dataset.s)sell.custId=nid}
   closeSheet();toast('Customer saved');render()},
 custdel:el=>{const id=el.dataset.id,c=S.customers[id];if(owedOf(id)>0.004){toast('This customer still owes you. Record their payment first.');return}
   ask('Remove '+c.name+'?','Their past sales stay in your records.','Remove',()=>{if(guard()){del('customers',id);if(sell.custId===id)sell.custId=''}},true)},
 pf:el=>{peo.f=el.dataset.v;render()},
 payopen:el=>paySheet(el.dataset.id),
 paysave:el=>{
   if(!guard())return;const id=el.dataset.id,amt=r2(num($('#pay-amt').value)),owed=owedOf(id);
   if(!(amt>0)){toast('Enter the amount received');return}if(amt>owed+0.005){toast('That is more than they owe ('+money(owed)+')');return}
   receivePayment(id,amt,SH.pm||'Cash',$('#pay-note').value.trim());closeSheet();toast('Payment recorded')},
 /* expenses */
 expnew:()=>expForm(),
 expsave:()=>{
   if(!guard())return;const amt=num($('#e-amt').value),date=$('#e-date').value||today();
   if(!(amt>0)){toast('Enter the amount');return}
   put('expenses',uid(),{ts:parseKey(date).getTime()+Date.now()%864e5,date,cat:$('#e-cat').value,amount:r2(amt),method:SH.em||'Cash',note:$('#e-note').value.trim(),by:by()});
   closeSheet();toast('Expense saved')},
 expopen:el=>{const e=S.expenses[el.dataset.id];if(!e)return;
   openSheet(`${shHead(esc(e.cat))}<div class="kv"><span class="muted">Amount</span><b class="mono">${money(e.amount)}</b></div><div class="kv"><span class="muted">Date</span><b>${esc(fmtDay(e.date,{weekday:'short',day:'numeric',month:'short',year:'numeric'}))}</b></div><div class="kv"><span class="muted">Paid with</span><b>${esc(MLABEL[e.method]||e.method||'Cash')}</b></div>${e.note?`<div class="kv"><span class="muted">Note</span><b>${esc(e.note)}</b></div>`:''}
   <div class="btns"><button class="btn owe" data-act="expdel" data-id="${el.dataset.id}">Delete expense</button></div>`)},
 expdel:el=>{if(guard()){del('expenses',el.dataset.id);closeSheet();toast('Expense deleted')}},
 /* reports, day */
 rp:el=>{rep.p=el.dataset.v;render()},
 exportcsv:()=>exportCSV(),
 closeday:()=>closeDay(),
 copyday:()=>{const v=$('#cd-count');copyText(dayText(dayData(),v&&v.value.trim()!==''?num(v.value):null))},
 /* setup */
 savecfg:()=>{if(!guard())return;put('settings','main',Object.assign({},cfg(),{biz:$('#s-biz').value.trim()||'Whyte Catch Tilapia Hub',phone:$('#s-phone').value.trim(),place:$('#s-place').value.trim(),momo:$('#s-momo').value.trim(),footer:$('#s-foot').value.trim(),lowDef:num($('#s-low').value)}));toast('Details saved')},
 saveby:()=>{LS.set('wct_by',$('#s-by').value.trim());toast('Name saved on this device')},
 backup:()=>doBackup(),
 restorepick:()=>{const f=$('#restoreFile');if(f)f.click()},
 sample:()=>loadSample(),
 rmsample:()=>ask('Remove example data?','Only the example products, customers, sales and expenses are removed. Anything you added yourself stays.','Remove',()=>{if(guard())removeSample()},true),
 eraseask:()=>openSheet(`${shHead('Erase everything?')}<p class="muted small">This permanently deletes every product, customer, sale, payment and expense. Download a backup first if you might need them. Type ERASE to confirm.</p>
   <label class="f"><span>Confirmation</span><input id="er-t" autocomplete="off" placeholder="ERASE"></label><div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn owe" data-act="erasego">Erase everything</button></div>`),
 erasego:()=>{if($('#er-t').value.trim()!=='ERASE'){toast('Type ERASE to confirm');return}if(!guard())return;closeSheet();eraseAll()}
};
function custPick(q){
  const st=custStats();q=q.trim().toLowerCase();
  const cs=arr('customers').filter(c=>!q||c.name.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));
  return `<button class="row" data-act="setcust" data-id=""><div class="r-main"><div class="r-title">Walk-in (no name)</div></div></button>`+cs.map(c=>`<button class="row" data-act="setcust" data-id="${c.id}"><div class="r-main"><div class="r-title">${esc(c.name)}</div><div class="r-sub">${esc(c.phone||'')}</div></div>${st[c.id]&&st[c.id].owed>0.004?`<span class="pill owe">owes ${m0(st[c.id].owed)}</span>`:''}</button>`).join('');
}
const INP={
 sellq:el=>{sell.q=el.value;$('#grid').innerHTML=gridHtml()},
 qty:el=>{const l=cart[+el.dataset.i];if(l){l.qty=Math.max(0,num(el.value));updCheckout()}},
 price:el=>{const l=cart[+el.dataset.i];if(l){l.price=Math.max(0,num(el.value));updCheckout()}},
 discount:el=>{sell.discount=el.value;updCheckout()},
 delivery:el=>{sell.delivery=el.value;updCheckout()},
 recv:el=>{sell.recv=el.value;sell.recvTouched=true;updCheckout()},
 snote:el=>{sell.note=el.value},
 custq:el=>{$('#clist').innerHTML=custPick(el.value)},
 peopleq:el=>{peo.q=el.value;$('#plist').innerHTML=peopleList()},
 salesq:el=>{sl.q=el.value;$('#slist').innerHTML=salesList()},
 rpid:el=>{const p=S.products[el.value],c=$('#r-cost');if(p&&c)c.value=qn(p.cost||0)},
 counted:el=>{const d=dayData(),v=$('#cd-var');if(el.value.trim()===''){v.textContent='';return}const diff=r2(num(el.value)-d.expected);
   v.textContent=Math.abs(diff)<0.005?'Your cash matches.':(diff>0?'Over by ':'Short by ')+money(Math.abs(diff));v.style.color=diff<0?'var(--owe)':diff>0?'var(--warn)':'var(--good)'}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(el&&ACT[el.dataset.act]){ACT[el.dataset.act](el,e);return}
  if(e.target.id==='sheet')closeSheet();
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.in;if(k&&INP[k])INP[k](e.target,e)});
document.addEventListener('change',e=>{
  if(e.target.id==='restoreFile'&&e.target.files&&e.target.files[0]){
    const f=e.target.files[0],r=new FileReader();r.onload=()=>restoreFrom(String(r.result));r.onerror=()=>toast('Could not read that file');r.readAsText(f);e.target.value='';
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
boot();
})();
